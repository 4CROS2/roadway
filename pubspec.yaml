name: roadway
description: "An application that helps you to find the best way to reach your destination."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  appwrite: ^25.4.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  meta: ^1.18.0
  equatable: ^2.1.0
  get_it: ^9.2.1
  go_router: ^18.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-VariableFont.ttf